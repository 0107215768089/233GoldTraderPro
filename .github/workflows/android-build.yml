name: Build 233GoldTraderPro APK

on:
  workflow_dispatch:
  push:
    paths:
      - "233GoldTraderPro_starter/233GoldTraderPro/android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Android project
        working-directory: 233GoldTraderPro_starter/233GoldTraderPro/android
        run: |
          echo "Checking Android project files..."
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Android project files found."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: 233GoldTraderPro_starter/233GoldTraderPro/android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: Gradle wrapper is missing."
            echo "The Android project needs a compatible Gradle wrapper."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 233GoldTraderPro-debug-apk
          path: 233GoldTraderPro_starter/233GoldTraderPro/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
