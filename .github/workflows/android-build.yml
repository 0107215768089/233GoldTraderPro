name: Build 233GoldTraderPro APK

on:
  workflow_dispatch:
  push:
    paths:
      - "233GoldTraderPro_starter/233GoldTraderPro/android/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: 233GoldTraderPro_starter/233GoldTraderPro/android
        run: |
          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 233GoldTraderPro-debug-apk
          path: 233GoldTraderPro_starter/233GoldTraderPro/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
